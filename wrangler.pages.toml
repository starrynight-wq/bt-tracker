# Cloudflare Pages deployment configuration.
#
# Deploy:  npx wrangler pages deploy --config wrangler.pages.toml
#   or:    connect the repository in Dashboard -> Workers & Pages -> Pages
#          (build command: npm run build, build output directory: public)
#
# The backend runs as Pages Functions from ./functions (see functions/[[path]].js).
# Replace the KV namespace `id`s with the real ones from:
#   Dashboard -> Workers & Pages -> KV

name = "bt-tracker-pages"
pages_build_output_dir = "./public"
compatibility_date = "2024-01-01"

[vars]
BT_INTERVAL = "1800"
BT_MIN_INTERVAL = "900"
BT_TRACKER_ID = "bt-tracker"

[[kv_namespaces]]
binding = "BT_TORRENTS"
id = "bt_torrents"

[[kv_namespaces]]
binding = "BT_TRACKERS"
id = "bt_trackers"

[[kv_namespaces]]
binding = "BT_ALERTS"
id = "bt_alerts"
